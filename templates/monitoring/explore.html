{% extends 'monitoring/base.html' %}
{% load static %}

{% block title %}Обзор — исследование метрик{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="fas fa-search me-2"></i> Обзор</h1>
</div>


<div class="row mb-4">
    <div class="col-md-3">
        <label class="form-label">Агент</label>
        <select id="agentSelect" class="form-select">
            <option value="">-- выберите агента --</option>
            {% for agent in agents %}
            <option value="{{ agent.id }}">{{ agent.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-3">
        <label class="form-label">Метрика</label>
        <select id="metricSelect" class="form-select" disabled>
            <option value="">-- выберите сначала агента --</option>
        </select>
    </div>
    <div class="col-md-3">
        <label class="form-label">Период</label>
        <select id="timeRange" class="form-select">
            <option value="1">Последний час</option>
            <option value="2" selected>Последние 2 часа</option>
            <option value="6">Последние 6 часов</option>
            <option value="12">Последние 12 часов</option>
            <option value="24">Последние сутки</option>
            <option value="48">Последние 2 дня</option>
            <option value="168">Последняя неделя</option>
            <option value="720">Последний месяц</option>
            <option value="2160">Последние 3 месяца</option>
            <option value="4320">Последние 6 месяцев</option>
            <option value="8760">Последний год</option>
        </select>
    </div>
    <div class="col-md-3 d-flex align-items-end">
        <button id="loadChart" class="btn btn-primary-custom w-100">
            <i class="fas fa-chart-line"></i> Загрузить
        </button>
    </div>
</div>

<div class="card-dashboard">
    <div class="card-header">
        <span class="card-title" id="chartTitle">Выберите метрику для отображения</span>
    </div>
    <div class="card-body" style="height: 500px;">
        <canvas id="exploreChart" style="width: 100%; height: 100%;"></canvas>
    </div>
</div>

<div class="card-dashboard mt-4">
    <div class="card-header">
        <span class="card-title">Данные</span>
    </div>
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-dark-custom mb-0">
                <thead>
                    <tr>
                        <th>Время</th>
                        <th>Значение</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <tr>
                        <td colspan="2" class="text-center text-muted">Нет данных</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let chartInstance = null;

document.getElementById('agentSelect').addEventListener('change', async function() {
    const agentId = this.value;
    const metricSelect = document.getElementById('metricSelect');

    metricSelect.innerHTML = '<option value="">-- загрузка метрик... --</option>';
    metricSelect.disabled = true;

    if (!agentId) {
        metricSelect.innerHTML = '<option value="">-- выберите сначала агента --</option>';
        return;
    }

    try {
        const response = await fetch(`/monitoring/api/agent/${agentId}/metrics/`);
        if (!response.ok) throw new Error('Failed to fetch metrics');

        const metrics = await response.json();

        const uniqueMetrics = [...new Set(metrics)].sort();

        metricSelect.innerHTML = '<option value="">-- выберите метрику --</option>';

        if (uniqueMetrics.length === 0) {
            metricSelect.innerHTML = '<option value="">Нет доступных метрик</option>';
            metricSelect.disabled = true;
        } else {
            uniqueMetrics.forEach(metric => {
                const option = document.createElement('option');
                option.value = metric;
                option.textContent = metric;
                metricSelect.appendChild(option);
            });
            metricSelect.disabled = false;
        }
    } catch (error) {
        console.error('Error loading metrics:', error);
        metricSelect.innerHTML = '<option value="">Ошибка загрузки</option>';
        metricSelect.disabled = true;
    }
});

document.getElementById('loadChart').addEventListener('click', async function() {
    const agentId = document.getElementById('agentSelect').value;
    const metric = document.getElementById('metricSelect').value;
    const hours = document.getElementById('timeRange').value;

    if (!agentId || !metric) {
        alert('Выберите агента и метрику');
        return;
    }

    document.getElementById('chartTitle').textContent = 'Загрузка...';

    try {
        const response = await fetch(`/monitoring/api/chart/${agentId}/${metric}/?hours=${hours}`);
        if (!response.ok) throw new Error('Failed to fetch chart data');

        const data = await response.json();

        document.getElementById('chartTitle').textContent = `${data.agent_name} — ${data.metric}`;

        const labels = data.labels.map(ts => {
            const date = new Date(ts);
            if (hours > 168) {
                return date.toLocaleString('ru-RU', {
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } else {
                return date.toLocaleTimeString('ru-RU', {
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });
            }
        });

        if (chartInstance) {
            chartInstance.destroy();
        }

        const ctx = document.getElementById('exploreChart').getContext('2d');
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: metric,
                    data: data.values,
                    borderColor: '#ff9f4a',
                    backgroundColor: 'rgba(255, 159, 74, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    pointHoverRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    intersect: false,
                    mode: 'index'
                },
                scales: {
                    x: {
                        ticks: {
                            color: '#a1a1aa',
                            maxTicksLimit: 15,
                            autoSkip: true
                        },
                        grid: {
                            color: '#2c2c2e'
                        }
                    },
                    y: {
                        ticks: {
                            color: '#a1a1aa'
                        },
                        grid: {
                            color: '#2c2c2e'
                        },
                        beginAtZero: false
                    }
                },
                plugins: {
                    legend: {
                        labels: {
                            color: '#e5e7eb'
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return `${context.dataset.label}: ${context.parsed.y.toFixed(2)}`;
                            }
                        }
                    }
                }
            }
        });

        const tableBody = document.getElementById('dataTableBody');
        tableBody.innerHTML = '';

        if (data.values.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">Нет данных за выбранный период</td></tr>';
        } else {
            const maxRows = Math.min(100, data.labels.length);
            const recentLabels = data.labels.slice(-maxRows);
            const recentValues = data.values.slice(-maxRows);

            for (let i = recentLabels.length - 1; i >= 0; i--) {
                const date = new Date(recentLabels[i]);
                const formattedTime = date.toLocaleString('ru-RU', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${formattedTime}</td>
                    <td>${recentValues[i] !== null ? recentValues[i].toFixed(2) : 'N/A'}</td>
                `;
                tableBody.appendChild(row);
            }

            if (data.values.length > maxRows) {
                const infoRow = document.createElement('tr');
                infoRow.innerHTML = `<td colspan="2" class="text-center text-muted">
                    Показаны последние ${maxRows} из ${data.values.length} записей
                </td>`;
                tableBody.insertBefore(infoRow, tableBody.firstChild);
            }
        }

    } catch (error) {
        console.error('Error loading chart:', error);
        document.getElementById('chartTitle').textContent = 'Ошибка загрузки данных';
        alert('Ошибка загрузки данных графика');
    }
});

document.getElementById('metricSelect').addEventListener('change', function() {
    if (this.value) {
        document.getElementById('loadChart').click();
    }
});

document.getElementById('timeRange').addEventListener('change', function() {
    const metric = document.getElementById('metricSelect').value;
    if (metric) {
        document.getElementById('loadChart').click();
    }
});
</script>
{% endblock %}
