<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCMSI — Вход</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #111217 0%, #1a1a24 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: #18181b;
            border: 1px solid #2c2c2e;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-logo i {
            font-size: 3rem;
            color: #ff9f4a;
            margin-bottom: 15px;
        }

        .login-logo h2 {
            color: #e5e7eb;
            font-weight: 600;
            margin: 0;
        }

        .login-logo p {
            color: #8b8b93;
            margin: 5px 0 0 0;
            font-size: 0.9rem;
        }

        .form-control {
            background-color: #1f1f24;
            border: 1px solid #2c2c2e;
            color: #e5e7eb;
            padding: 12px 16px;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .form-control:focus {
            background-color: #2a2a30;
            border-color: #ff9f4a;
            box-shadow: 0 0 0 3px rgba(255, 159, 74, 0.1);
            color: #ffffff;
        }

        .form-control::placeholder {
            color: #6b6b75;
        }

        .input-group-text {
            background-color: #1f1f24;
            border: 1px solid #2c2c2e;
            color: #8b8b93;
            border-radius: 8px 0 0 8px;
        }

        .input-group .form-control {
            border-left: none;
            border-radius: 0 8px 8px 0;
        }

        .btn-login {
            background-color: #ff9f4a;
            border: none;
            color: #111217;
            font-weight: 600;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            transition: all 0.3s;
        }

        .btn-login:hover {
            background-color: #ffb673;
            transform: translateY(-1px);
            box-shadow: 0 8px 16px rgba(255, 159, 74, 0.3);
        }

        .alert {
            border-radius: 8px;
            border: none;
        }

        .alert-danger {
            background-color: rgba(220, 53, 69, 0.2);
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <i class="fas fa-chart-line"></i>
                <h2>PCMSI</h2>
                <p>Система мониторинга</p>
            </div>

            {% if form.errors %}
            <div class="alert alert-danger">
                <i class="fas fa-exclamation-circle me-2"></i>
                Неверное имя пользователя или пароль
            </div>
            {% endif %}

            {% if next %}
                {% if user.is_authenticated %}
                <div class="alert alert-warning">
                    У вашей учетной записи нет доступа к этой странице.
                </div>
                {% endif %}
            {% endif %}

            <form method="post" action="{% url 'login' %}">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label text-secondary">Имя пользователя</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-user"></i>
                        </span>
                        <input type="text" name="username" class="form-control"
                               placeholder="Введите имя пользователя" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-secondary">Пароль</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input type="password" name="password" class="form-control"
                               placeholder="Введите пароль" required>
                    </div>
                </div>

                <input type="hidden" name="next" value="{{ next }}">

                <button type="submit" class="btn btn-login">
                    <i class="fas fa-sign-in-alt me-2"></i>Войти
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
